[package]
name = "round-eliminator-3"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Serde's strict input validation has no TypeScript shape equivalent.
ts-rs = { version = "12", features = ["no-serde-warnings"] }
anyhow = "1"
rustsat = { version = "0.7.5", default-features = false }
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustsat-cadical = { version = "0.7.5", features = ["v2-2-1"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rustsat-batsat = "0.7.5"

[[bench]]
name = "configuration_matching"
harness = false

[[bench]]
name = "zero_round"
harness = false
