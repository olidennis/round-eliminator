[package]
name = "round-eliminator-3-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
round-eliminator-3 = { path = "../core" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
serde_json = "1"
tower-http = { version = "0.7", features = ["fs"] }
mimalloc = { version = "=0.1.52", features = ["v2"] }
libmimalloc-sys = { version = "=0.1.49", features = ["extended"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "test-util"] }
